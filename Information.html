<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Portraitclikxxxx</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(to bottom right, #3cb371, #2e8b57); /* green tones */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 3em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .instagram-icon {
            width: 40px;
            height: 40px;
            transition: transform 0.2s ease;
        }

        .instagram-icon:hover {
            transform: scale(1.1);
        }

        a {
            display: inline-block;
        }
    </style>
</head>
<body>

<h1>
    Welcome to Portraitclikx
    <a href="https://www.instagram.com/potraitclikx/" target="_blank" title="Follow us on Instagram">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"
             alt="Instagram" class="instagram-icon">
    </a>
</h1>

</body>
</html>
